name: ShopSphere CD

on:
  workflow_run:
    workflows:
      - ShopSphere CI
    types:
      - completed

jobs:
  deploy:
    name: Validate Kubernetes Manifests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate Kubernetes YAML syntax
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = glob.glob("k8s/*.yaml")

          for file in files:
              print(f"Validating {file}")
              with open(file, "r", encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))

          print("All Kubernetes YAML files are syntactically valid.")
          PY

      - name: CD Validation Complete
        run: echo "ShopSphere Kubernetes manifests passed CI/CD YAML validation."