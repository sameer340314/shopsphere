name: ShopSphere CD

on:
  workflow_run:
    workflows:
      - ShopSphere CI
    types:
      - completed

jobs:
  deploy:
    name: Validate Release and Kubernetes Manifests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set release image tag
        id: release-tag
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          TAG="${FULL_SHA:0:7}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release image tag: $TAG"

      - name: Verify backend release image
        run: |
          docker pull sameer340314/shopsphere-backend:${{ steps.release-tag.outputs.TAG }}

      - name: Verify frontend release image
        run: |
          docker pull sameer340314/shopsphere-frontend:${{ steps.release-tag.outputs.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate Kubernetes YAML syntax
        run: |
          python - <<'PY'
          import glob
          import yaml

          files = glob.glob("k8s/*.yaml")

          for file in files:
              print(f"Validating {file}")
              with open(file, "r", encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))

          print("All Kubernetes YAML files are syntactically valid.")
          PY

      - name: CD Release Validation Complete
        run: |
          echo "ShopSphere release validation completed successfully."
          echo "Release image tag: ${{ steps.release-tag.outputs.TAG }}"