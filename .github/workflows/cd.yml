name: ShopSphere CD

on:
  workflow_run:
    workflows:
      - ShopSphere CI
    types:
      - completed

jobs:
  deploy:
    name: Validate Kubernetes Manifests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes YAML
        run: |
          for file in k8s/*.yaml; do
            echo "Validating $file"
            kubectl create --dry-run=client --validate=false -f "$file" -o yaml > /dev/null
          done

      - name: CD Validation Complete
        run: echo "ShopSphere Kubernetes manifests passed CI/CD validation."